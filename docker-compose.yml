
services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  migrate:
    build: ./alembic
    container_name: migrate
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./alembic:/app/alembic
      - ./shared:/app/shared
    command: alembic -c /app/alembic/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  public_bot:
    build: ./public_bot
    container_name: public_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./public_bot:/app/bot
      - ./shared:/app/bot/shared
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin_bot:
    build: ./admin_bot
    container_name: admin_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./admin_bot:/app/bot
      - ./shared:/app/bot/shared
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  battle_manager:
    build: ./battle_manager
    container_name: battle_manager
    restart: always
    env_file:
      - .env
    volumes:
      - ./battle_manager:/app/
      - ./shared:/app/manager_bot/shared/
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully



volumes:
  redis_data:
  pgdata: